name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_APP_TITLE: "紫微斗数"
          BASE_URL: /

      - name: Deploy to DigitalOcean via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          port: ${{ secrets.DO_PORT }}
          username: root
          key: ${{ secrets.DO_DEPLOY_KEY }}
          source: "dist/*"
          target: "/var/www/html/"
          strip_components: 1
          overwrite: true
          quiet: false
