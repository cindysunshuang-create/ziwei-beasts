name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_APP_TITLE: "紫微斗数"
          BASE_URL: /

      - name: Deploy to DigitalOcean
        uses: easingthemes/ssh-deploy@v5
        with:
          HOST: ${{ secrets.DO_HOST }}
          USERNAME: root
          PORT: ${{ secrets.DO_PORT }}
          KEY: ${{ secrets.DO_DEPLOY_KEY }}
          SOURCE: "dist/"
          TARGET: "/var/www/html"
          ARGS: "-avz --delete"
          EXCLUDE: ""
